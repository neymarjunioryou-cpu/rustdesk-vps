name: RustDesk Desktop (6hr)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install XFCE + Xvfb + dbus
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xvfb dbus-x11 wget

      - name: Install RustDesk
        run: |
          wget -q -O /tmp/rustdesk.deb \
            https://github.com/rustdesk/rustdesk/releases/download/1.4.6/rustdesk-1.4.6-x86_64.deb
          sudo dpkg -i /tmp/rustdesk.deb
          sudo apt-get install -f -y -qq

      - name: Start RustDesk service
        run: |
          sudo systemctl start rustdesk 2>/dev/null || \
            nohup /usr/lib/rustdesk/rustdesk --service &>/dev/null &
          sleep 3

      - name: Set password
        run: |
          mkdir -p ~/.local/share/rustdesk/config
          cat > ~/.local/share/rustdesk/config/RustDesk2.toml << 'EOF'
password = "rdk123"
EOF
          cat > ~/.local/share/rustdesk/config/RustDesk.toml << 'EOF'
rendezvous_server = "rs-ny.rustdesk.com"
relay_server = "rs-ny.rustdesk.com"
EOF

      - name: Restart RustDesk to apply
        run: |
          sudo systemctl restart rustdesk 2>/dev/null || \
            (pkill rustdesk 2>/dev/null; sleep 1; \
             nohup /usr/lib/rustdesk/rustdesk --service &>/dev/null &)
          sleep 3

      - name: Start virtual display + XFCE
        run: |
          sudo service dbus start 2>/dev/null || true
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99
          startxfce4 &>/dev/null &
          sleep 5

      - name: Display connection info
        run: |
          echo "============================================="
          echo "  RUSTDESK ID:"
          cat /var/lib/rustdesk/config/RustDesk.toml 2>/dev/null | grep -i "id" | head -3
          cat ~/.local/share/rustdesk/config/RustDesk.toml 2>/dev/null | grep -i "id" | head -3
          ls ~/.local/share/rustdesk/ 2>/dev/null
          echo "============================================="
          echo "  Password: rdk123"
          echo "  Install RustDesk on Windows from:"
          echo "  https://rustdesk.com/"
          echo "============================================="
          echo "  Machine stays alive for 6 hours"
          echo "  Cancel the workflow to stop early"
          echo "============================================="

      - name: Keep alive
        run: sleep 21600
