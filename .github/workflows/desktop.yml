name: RustDesk Desktop (6hr)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install XFCE + Xvfb + dbus
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xvfb dbus-x11 wget

      - name: Install RustDesk
        run: |
          wget -q -O /tmp/rustdesk.deb \
            https://github.com/rustdesk/rustdesk/releases/download/1.3.8/rustdesk-1.3.8-x86_64-unknown-linux-gnu.deb
          sudo dpkg -i /tmp/rustdesk.deb 2>/dev/null || true
          sudo apt-get install -f -y -qq
          dpkg -l rustdesk 2>/dev/null | tail -1

      - name: Start virtual display + XFCE
        run: |
          sudo service dbus start 2>/dev/null || true
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99
          startxfce4 &>/dev/null &
          sleep 5

      - name: Set RustDesk password
        run: |
          export DISPLAY=:99
          rustdesk --password rdk123 2>/dev/null || true
          sleep 2

      - name: Display connection info
        run: |
          echo "============================================="
          echo "  RUSTDESK ID:"
          cat ~/.local/share/rustdesk/config/RustDesk.toml 2>/dev/null | grep id | head -1
          echo "============================================="
          echo "  Password: rdk123"
          echo "============================================="
          echo "  Machine stays alive for 6 hours"
          echo "  Cancel to stop early"
          echo "============================================="

      - name: Keep alive
        run: sleep 21600
