name: RustDesk VPS
on: [workflow_dispatch]
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install XFCE + deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xvfb dbus-x11 wget libxdo3 gstreamer1.0-pipewire
      - name: Install RustDesk
        run: |
          wget -q -O /tmp/rd.deb https://github.com/rustdesk/rustdesk/releases/download/1.4.6/rustdesk-1.4.6-x86_64.deb
          sudo dpkg -i /tmp/rd.deb 2>/dev/null || true
          sudo apt-get install -f -y -qq
      - name: Start RustDesk service
        run: |
          sudo systemctl start rustdesk 2>/dev/null || nohup /usr/lib/rustdesk/rustdesk --service &>/dev/null &
          sleep 5
      - name: Set password
        run: |
          mkdir -p ~/.config/rustdesk
          echo 'password = "rdk123"' > ~/.config/rustdesk/RustDesk2.toml
      - name: Start desktop
        run: |
          sudo service dbus start 2>/dev/null || true
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99
          startxfce4 &>/dev/null &
          sleep 5
      - name: Find and show RustDesk ID
        run: |
          sleep 5
          echo "=== Searching for RustDesk config ==="
          for d in /home/*/.local/share/rustdesk /home/*/.config/rustdesk /root/.local/share/rustdesk /root/.config/rustdesk /var/lib/rustdesk /etc/rustdesk; do
            if [ -d "$d" ]; then
              echo "FOUND: $d"
              find "$d" -type f -name "*.toml" -exec echo "--- {} ---" \; -exec cat {} \;
            fi
          done
          echo "=== Also checking /usr/lib/rustdesk ==="
          ls -la /usr/lib/rustdesk/ 2>/dev/null || echo "not found"
          echo "=== DONE ==="
          echo "PASSWORD: rdk123"
      - name: Keep alive
        run: sleep 21600
